<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Focus Quest — gamify your productivity journey.">
  <!--
    Firebase web OAuth client ID, read by google_sign_in_web if Google
    Sign-In is ever re-enabled on web. Harmless to keep while the app uses
    email + guest auth.
  -->
  <meta name="google-signin-client_id"
    content="555270589940-95bame3is9e6ki2chnf0rk37cnduspq6.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Focus Quest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Focus Quest</title>
  <link rel="manifest" href="manifest.json">

  <!-- Branded loading splash shown instantly while the Flutter engine boots. -->
  <style>
    :root {
      --fq-bg: #F5F1E8;
      --fq-fg: #2C2C2C;
      --fq-primary: #7A9E7E;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fq-bg: #1E2A1F;
        --fq-fg: #E8E5DF;
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--fq-bg);
    }

    #fq-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: var(--fq-bg);
      transition: opacity 0.4s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #fq-loading.fq-hide {
      opacity: 0;
      pointer-events: none;
    }

    .fq-rocket {
      width: 72px;
      height: 72px;
      color: var(--fq-primary);
      animation: fq-float 2.2s ease-in-out infinite;
    }

    @keyframes fq-float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-4deg); }
    }

    .fq-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(122, 158, 126, 0.25);
      border-top-color: var(--fq-primary);
      animation: fq-spin 0.9s linear infinite;
    }

    @keyframes fq-spin {
      to { transform: rotate(360deg); }
    }

    .fq-title {
      color: var(--fq-fg);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.3px;
      opacity: 0.85;
    }

    @media (prefers-reduced-motion: reduce) {
      .fq-rocket,
      .fq-spinner {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="fq-loading">
    <svg class="fq-rocket" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M9.19 6.35c-2.04 2.29-3.44 5.58-3.57 5.89L2 10.69l4.05-4.05c.47-.47 1.15-.68 1.81-.55l1.33.26zM11.17 17s3.74-1.55 5.89-3.7c5.4-5.4 4.5-9.62 4.21-10.57-.95-.3-5.17-1.19-10.57 4.21C8.55 9.09 7 12.83 7 12.83L11.17 17zm6.48-2.19c-2.29 2.04-5.58 3.44-5.89 3.57L13.31 22l4.05-4.05c.47-.47.68-1.15.55-1.81l-.26-1.33zM9 18c0 .83-.34 1.58-.88 2.12C6.94 21.3 2 22 2 22s.7-4.94 1.88-6.12C4.42 15.34 5.17 15 6 15c1.66 0 3 1.34 3 3zm4-9c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2z" />
    </svg>
    <div class="fq-spinner"></div>
    <div class="fq-title">Focus Quest</div>
  </div>

  <script>
    // Remove the splash once Flutter has rendered its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('fq-loading');
      if (!loader) return;
      loader.classList.add('fq-hide');
      window.setTimeout(function () { loader.remove(); }, 450);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
